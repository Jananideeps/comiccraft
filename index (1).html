<!DOCTYPE html>
<html>
<head>
  <title>ComicCraft</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>🎨 ComicCraft</h1>
  <p class="subtitle">AI Comic Story Creator using Gemini Models</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form action="/generate" method="post">
    <label>Story Prompt</label>
    <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>
    <label>Main Character Name</label>
    <input name="character_name" required placeholder="Luna">
    <label>Setting</label>
    <select name="setting"><option>Forest</option><option>School</option><option>City</option><option>Space</option></select>
    <label>Story Tone</label>
    <select name="tone"><option>Light-hearted</option><option>Dramatic</option><option>Poetic</option><option>Funny</option></select>
    <label>Art Style</label>
    <select name="art_style"><option>Comic book</option><option>Anime</option><option>Pixel art</option><option>Realistic</option></select>
    <button type="submit">✨ Generate Comic</button>
  </form>
</div>
</body>
</html>
