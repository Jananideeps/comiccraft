<!DOCTYPE html>
<html>
<head>
  <title>Comic Preview</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container wide">
  <h1>📖 Your Comic</h1>
  {% for panel in layout %}
  <section class="panel">
    <h2>Panel {{ panel.panel_number }}: {{ panel.title }}</h2>
    <img src="{{ panel.image_path }}" alt="Comic panel">
    <p><em>{{ panel.scene_description }}</em></p>
    <p><strong>Caption:</strong> {{ panel.caption }}</p>
    <p><strong>Narration:</strong> {{ panel.narration }}</p>
    <details><summary>Image Prompt</summary><p>{{ panel.image_prompt }}</p></details>
  </section>
  {% endfor %}
  <a class="button" href="{{ pdf_path }}" download>⬇ Download Your Comic as PDF</a>
  <a class="secondary" href="/">Create Another Comic</a>
</div>
</body>
</html>
